<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="color-scheme" content="light dark"><title>Korokoro · dice</title>
<style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}body{padding:8px;box-sizing:border-box;font-family:system-ui}korokoro-roller{display:block;max-width:100%}.credit{display:block;text-align:right;font-size:12px;color:CanvasText;min-height:24px;margin-top:4px}</style>
</head><body><korokoro-roller id="roller" storage="none" keyboard="false"></korokoro-roller>
<a class="credit" href="https://johnmorrisdotca.github.io/korokoro/" target="_blank" rel="noopener">Korokoro</a>
<script type="module">
import { parseNotation, formatNotation } from "../dist/index.js";
import "../dist/element-define.js";
const q = new URLSearchParams(location.search.length > 1 ? location.search : location.hash.slice(1));
const element = document.getElementById("roller");
const notation = q.get("notation") ?? q.get("dice") ?? q.get("roll") ?? "2d6";
element.setAttribute("notation", parseNotation(notation) ? notation : "2d6");
if (!q.has("notation") && (q.has("dice") || q.has("roll")) && !q.has("placeholder")) element.setAttribute("placeholder", "false");
const choices = { size: ["small", "medium", "large"], theme: ["auto", "light", "dark"], cloth: ["green", "blue", "red", "black", "wood"], "one-pip": ["red", "black"] };
element.setAttribute("size", choices.size.includes(q.get("size")) ? q.get("size") : "medium");
for (const [name, values] of Object.entries(choices)) {
  const value = q.get(name) ?? (name === "one-pip" ? q.get("onepip") : null);
  if (values.includes(value)) element.setAttribute(name, value);
}
const lang = q.get("lang") === "ja" ? "ja" : q.get("lang") === "en" ? "en" : String(navigator.language).toLowerCase().startsWith("ja") ? "ja" : "en";
document.documentElement.lang = lang;
element.setAttribute("lang", lang);
for (const name of ["sound", "hold", "placeholder", "keyboard", "wide", "language-chooser", "dice-war"]) {
  const value = q.get(name);
  if (value !== null && ["", "on", "true", "1", "off", "false", "no", "0"].includes(value.trim().toLowerCase())) element.setAttribute(name, ["off", "false", "no", "0"].includes(value.trim().toLowerCase()) ? "false" : "");
}
for (const [name, min, max] of [["width", 48, 2048], ["animation-ms", 0, 10000]]) {
  const value = Number(q.get(name));
  if (q.has(name) && Number.isFinite(value) && value >= min && value <= max) element.setAttribute(name, String(value));
}
const seed = q.get("seed");
if (seed !== null && seed.length <= 200) element.setAttribute("seed", seed);
const label = q.get("label");
if (label !== null && label.length <= 200) element.setAttribute("label", label);
// Existing colour links remain supported, with colours validated before becoming CSS values.
const theme = {};
for (const name of ["felt", "ink"]) if (/^#[0-9a-f]{3,8}$/i.test(q.get(name) ?? "")) theme[`--kk-${name}`] = q.get(name);
element.options = { storage: null, query: "", shareBase: "https://johnmorrisdotca.github.io/korokoro/", theme };
element.addEventListener("korokoro-roll", (event) => {
  if (parent === window) return;
  const detail = JSON.parse(JSON.stringify(event.detail));
  parent.postMessage({ type: event.type, detail }, "*");
  // Preserve the old message for hosts already listening for it.
  parent.postMessage({ korokoro: "roll", notation: formatNotation(detail.spec), total: detail.total, dice: detail.faces }, "*");
});
</script></body></html>
