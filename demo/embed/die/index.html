<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><meta name="color-scheme" content="light dark"><title>Korokoro · one die</title>
<style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}body{display:flex;align-items:center;justify-content:center}korokoro-die{max-width:100%;max-height:100%}</style>
</head><body><korokoro-die id="die"></korokoro-die><script type="module">
import { isSides } from "../../dist/index.js";
import "../../dist/element-define.js";
const q = new URLSearchParams(location.search);
const element = document.getElementById("die");
const sides = q.get("sides") === "F" ? "F" : Number(q.get("sides"));
if (isSides(sides)) element.setAttribute("sides", String(sides));
const face = Number(q.get("face"));
if (q.has("face") && Number.isInteger(face) && (sides === "F" ? face >= -1 && face <= 1 : face >= 1 && face <= (isSides(sides) ? sides : 6))) element.setAttribute("face", String(face));
const choices = { size: ["small", "medium", "large"], theme: ["auto", "light", "dark"], cloth: ["green", "blue", "red", "black", "wood"], "one-pip": ["red", "black"], lang: ["en", "ja"] };
for (const [name, values] of Object.entries(choices)) if (values.includes(q.get(name))) element.setAttribute(name, q.get(name));
if (q.get("lang") === "ja") document.documentElement.lang = "ja";
for (const name of ["rollable", "sound"]) {
  const value = q.get(name);
  if (value !== null && ["", "on", "true", "1", "off", "false", "no", "0"].includes(value.trim().toLowerCase())) element.setAttribute(name, ["off", "false", "no", "0"].includes(value.trim().toLowerCase()) ? "false" : "");
}
for (const [name, min, max] of [["width", 48, 2048], ["animation-ms", 0, 10000]]) { const value = Number(q.get(name)); if (q.has(name) && Number.isFinite(value) && value >= min && value <= max) element.setAttribute(name, String(value)); }
for (const name of ["seed", "label"]) if (q.has(name) && q.get(name).length <= 200) element.setAttribute(name, q.get(name));
element.addEventListener("korokoro-die-roll", (event) => { if (parent !== window) parent.postMessage({ type: event.type, detail: event.detail }, "*"); });
</script></body></html>
