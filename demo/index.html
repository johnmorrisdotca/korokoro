<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Korokoro · fair dice with the odds of every throw</title>
    <meta name="description" content="Tap dice to build a roll: up to ten of d4, d6, d8, d10, d12, d20, d30 and d100, in any mix. Hold dice and roll the rest. Or type any dice: 4d6 drop the lowest, exploding dice, rerolls, Fate dice, a d14. Exact odds, seeded rolls, history and stats. Free and open source." />
    <meta name="theme-color" content="#2f5d4a" />
    <meta property="og:title" content="Korokoro dice roller" />
    <meta property="og:description" content="Fair dice for the table, with the odds of every throw." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='6' y='6' width='88' height='88' rx='20' fill='%23fffdf7' stroke='%232f5d4a' stroke-width='8'/%3E%3Ccircle cx='30' cy='30' r='9' fill='%231f2320'/%3E%3Ccircle cx='50' cy='50' r='11' fill='%23b5452c'/%3E%3Ccircle cx='70' cy='70' r='9' fill='%231f2320'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="family.css" />
    <link rel="stylesheet" href="site.css" />
  </head>
  <body>
    <main>
      <!-- family:header -->
      <div id="roller"></div>
      <!-- family:unreviewed -->
      <section class="more" aria-labelledby="more-title">
        <h2 id="more-title" data-say="moreTitle"></h2>
        <p data-say="moreText"></p>
        <p class="ways"><a href="docs/" data-say="docs"></a> · <a href="api/" data-say="plain"></a></p>
        <ul>
          <li><button type="button" data-roll="4d6dl1"><code>4d6dl1</code><span data-say="ex1"></span></button></li>
          <li><button type="button" data-roll="6#4d6dl1"><code>6#4d6dl1</code><span data-say="ex10"></span></button></li>
          <li><button type="button" data-roll="3d6!"><code>3d6!</code><span data-say="ex2"></span></button></li>
          <li><button type="button" data-roll="2d6r<3+4"><code>2d6r&lt;3+4</code><span data-say="ex3"></span></button></li>
          <li><button type="button" data-roll="2d8ro<3"><code>2d8ro&lt;3</code><span data-say="ex4"></span></button></li>
          <li><button type="button" data-roll="4dF"><code>4dF</code><span data-say="ex5"></span></button></li>
          <li><button type="button" data-roll="1d20+1d4+3"><code>1d20+1d4+3</code><span data-say="ex6"></span></button></li>
          <li><button type="button" data-roll="1d14"><code>d14</code><span data-say="ex7"></span></button></li>
          <li><button type="button" data-roll="1d[Yes,No,Maybe]"><code>d[Yes,No,Maybe]</code><span data-say="ex8"></span></button></li>
          <li><button type="button" data-roll="2d20kh1+5"><code>2d20kh1+5</code><span data-say="ex9"></span></button></li>
        </ul>
      </section>
      <!-- family:footer -->
    </main>
    <script>
      /* family:script */
    </script>
    <script type="module">
      import { mountRoller, parseNotation } from "./dist/index.js";

      // The page's own words, in the two languages the tray speaks. Set as text, never as HTML.
      const WORDS = {
        en: {
          pitch: "Fair dice for the table, with the odds of every throw. Tap a die to choose it, tap more to add them, up to ten, and tap the felt to roll.",
          name: "Korokoro is Japanese for the sound of something small rolling along.",
          nameLink: "About the name",
          moreTitle: "More dice, by notation",
          moreText: "The buttons are the dice a table owns: d4, d6, d8, d10, d12, d20, d30 and d100, in any mix. After a roll, tap a die on the felt to hold it and roll the rest. Anything else is typed into the notation box beside the bonus, made under “More”, or tapped here. “Games” has the dice of 44 games, from Yahtzee to chō-han, each read the way the game reads it.",
          ex1: "Four d6, drop the lowest: an ability score",
          ex2: "Exploding dice: a 6 throws another die",
          ex3: "Reroll every 1 and 2 until they clear, then add 4",
          ex4: "Reroll a 1 or a 2 once, and take what comes",
          ex5: "Four Fate dice: plus, blank or minus",
          ex6: "A d20 and a d4 together, plus 3",
          ex7: "A die of any size, from 2 sides to 1000",
          ex8: "A die of your own: any faces you like",
          ex9: "Advantage: two d20, keep the highest, add 5",
          ex10: "Six ability scores in one tap",
          docs: "Read the documentation",
          plain: "Dice as plain text, from an address",
          foot: "Rolls use your device's cryptographic generator unless you choose a seed. Your history stays on this device. Dice sounds from Kenney's Casino Audio, CC0.",
        },
        ja: {
          pitch: "卓のための公平なダイスです。すべての出目の確率がわかります。ダイスをタップして選び、さらにタップして追加し（10個まで）、フェルトをタップして振ります。",
          name: "「コロコロ」は、小さなものが転がる音を表す日本語です。",
          nameLink: "名前について（英語）",
          moreTitle: "表記で振る、そのほかのダイス",
          moreText: "ボタンは卓でよく使うダイスです（d4、d6、d8、d10、d12、d20、d30、d100）。組み合わせて振れます。振ったあと、フェルトのダイスをタップするとホールドでき、残りだけを振り直せます。そのほかのダイスは、修正値の横の表記欄に入力するか、「その他」で作るか、ここでタップします。「ゲーム」には、ヤッツィーから丁半まで44のゲームのダイスと読み方が入っています。",
          ex1: "d6を4個振り、最小の1個を除きます（能力値）",
          ex2: "爆発ダイス: 6が出たらもう1個振ります",
          ex3: "1と2を出なくなるまで振り直し、4を足します",
          ex4: "1か2を一度だけ振り直します",
          ex5: "フェイトダイス4個: プラス、空白、マイナス",
          ex6: "d20とd4を一緒に振り、3を足します",
          ex7: "2面から1000面まで、好きな面数のダイス",
          ex8: "自分で作るダイス: 面は自由です",
          ex9: "有利: d20を2個振って大きいほうを採用し、5を足します",
          ex10: "能力値6つを一度に振ります",
          docs: "ドキュメントを読む（英語）",
          plain: "アドレスからダイスを振り、テキストで受け取る",
          foot: "シードを選ばないかぎり、この端末の暗号論的乱数で振ります。履歴はこの端末にだけ保存されます。ダイスの音は Kenney の Casino Audio（CC0）です。",
        },
      };

      // The header, the footer and the language chooser are the family's (scripts/family-template.mjs): the address first, then what this device chose, then the browser's language.
      let roller;
      const language = familyLanguage({ id: "korokoro", words: WORDS, onChange: (lang) => roller.setLocale(lang) });
      // A shared link keeps the language it was made in.
      roller = mountRoller(document.getElementById("roller"), { wide: true, locale: language.lang, shareBase: location.origin + location.pathname + (language.asked !== null ? "?lang=" + language.asked : "") });

      for (const button of document.querySelectorAll("[data-roll]")) {
        button.addEventListener("click", () => {
          roller.setSpec(parseNotation(button.dataset.roll));
          roller.roll();
          document.getElementById("roller").scrollIntoView({ block: "start", behavior: "smooth" });
        });
      }
    </script>
  </body>
</html>
