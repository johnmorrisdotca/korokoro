name: Publish to npm
# Run by hand (Actions → Publish to npm → Run workflow) with the tag to publish,
# e.g. v1.0.0. It checks the package, builds it and publishes that version to
# npm as it stands at the tag. The token is the repository's NPM_TOKEN secret.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: The version tag to publish, e.g. v1.0.0
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: The tag is the version in package.json
        run: test "v$(node -p "require('./package.json').version")" = "${{ inputs.ref }}"
      - run: pnpm check
      - run: pnpm build
      - run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
